<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#211b29" />
    <title>Sleepy Doll</title>
    <script>
      // 首帧之前定好主题：主题是 React 挂载之后才恢复的，深色下会先闪一下白底，
      // 那一瞬间开关显示的主题也和页面不一致。
      document.documentElement.dataset.theme =
        localStorage.getItem("sleepy-doll-theme") === "dark" ? "dark" : "light";
    </script>
    <style>
      /* 样式表到位之前的窗口底色，取 --surface 的同一个值。 */
      html {
        background: #fff;
      }
      html[data-theme="dark"] {
        background: #1b1b1b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      function showBootError(message) {
        const root = document.getElementById("root");
        if (!root || root.childElementCount) return;
        document.body.style.margin = "0";
        const dark = document.documentElement.dataset.theme === "dark";
        document.body.style.background = dark ? "#1b1b1b" : "#fff";
        document.body.style.color = dark ? "#e9e9e9" : "#202020";
        root.style.padding = "72px";
        root.style.font = "18px sans-serif";
        root.textContent = `界面载入失败：${message}`;
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            window.ipc?.postMessage(
              JSON.stringify({
                id: "desktop-ready",
                method: "window.ready",
                params: {
                  dark: document.documentElement.dataset.theme === "dark",
                },
              }),
            );
          }),
        );
      }
      window.addEventListener(
        "error",
        (event) => showBootError(event.message || "页面资源未能载入"),
        true,
      );
      window.addEventListener("unhandledrejection", (event) =>
        showBootError(event.reason?.message ?? String(event.reason)),
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
