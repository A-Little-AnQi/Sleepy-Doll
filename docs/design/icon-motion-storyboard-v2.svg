<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" style="width:100%;height:auto;display:block">
  <defs>
    <linearGradient id="mintViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66C9B7"/>
      <stop offset="1" stop-color="#8A78E6"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#2C3530" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#A9B0AB"/>
    </marker>

    <!-- Every icon keeps one 24×24 outline. State layers are added behind and inside it. -->
    <g id="moonOutline" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.2c5.25 0 8.8 3.55 8.8 8.8s-3.55 8.8-8.8 8.8S3.2 17.25 3.2 12 6.75 3.2 12 3.2Z"/>
      <path d="M13.25 6.35a4.85 4.85 0 0 0 4.55 6.55 5.9 5.9 0 1 1-4.55-6.55Z"/>
    </g>
    <path id="moonFill" d="M12 4.35c4.55 0 7.65 3.1 7.65 7.65s-3.1 7.65-7.65 7.65S4.35 16.55 4.35 12 7.45 4.35 12 4.35Z"/>
    <path id="moonDepth" d="M6.1 14.25c1.35 2.4 3.55 3.75 6.45 3.75 2.65 0 4.75-1.15 6.15-3.2-1.05 3.05-3.55 4.85-6.8 4.85-3.05 0-5.45-1.75-6.65-4.4Z"/>
    <path id="moonTrace" d="M4.9 8.8C6.1 5.9 8.55 4.35 12 4.35c4.55 0 7.65 3.1 7.65 7.65"/>

    <g id="scanOutline" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 4H5.7A1.7 1.7 0 0 0 4 5.7V8M16 4h2.3A1.7 1.7 0 0 1 20 5.7V8M20 16v2.3a1.7 1.7 0 0 1-1.7 1.7H16M8 20H5.7A1.7 1.7 0 0 1 4 18.3V16"/>
      <circle cx="12" cy="12" r="3.25"/>
      <path d="M12 6.5v2.25M12 15.25v2.25M6.5 12h2.25M15.25 12h2.25"/>
    </g>
    <rect id="scanFill" x="5.25" y="5.25" width="13.5" height="13.5" rx="3.4"/>
    <rect id="scanBand" x="5.25" y="9.1" width="13.5" height="5.7" rx="1.2"/>
    <path id="scanTrace" d="M5.5 9.1h13M5.5 14.9h13"/>

    <g id="routeOutline" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3.5 6.1 5.3-2.3 6.3 2.3 5.4-2.3v14.1l-5.4 2.3-6.3-2.3-5.3 2.3Z"/>
      <path d="M8.8 3.8v14.1M15.1 6.1v14.1"/>
      <path d="M5.8 14.7c2.1-4.5 4.2.8 6.4-3.3 1.2-2.25 3.1-2.3 5.65-3.5" stroke-dasharray="1.7 2"/>
    </g>
    <g id="routeNodes" fill="#FCFDFB" stroke="currentColor" stroke-width="1.15">
      <circle cx="5.8" cy="14.7" r="1.25"/>
      <circle cx="17.85" cy="7.9" r="1.25"/>
    </g>
    <path id="routeFillA" d="m4.65 6.85 4.15-1.8V16.7l-4.15 1.8Z"/>
    <path id="routeFillB" d="m9.95 5.05 4 1.55v11.85l-4-1.55Z"/>
    <path id="routeFillC" d="m16.25 6.85 3.1-1.35v11.65l-3.1 1.3Z"/>
    <path id="routeTrace" d="M4.8 7 8.7 5.3M10.2 5.3l3.6 1.4M16.35 7l2.8-1.2"/>
    <path id="routeFoldTrace" d="M8.8 4.6v12.7M15.1 6.7v12.6"/>

    <g id="sendOutline" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.35 3.65c.85-.3 1.7.52 1.4 1.4l-4.3 14.15c-.26.85-1.35 1.02-1.84.28l-3.34-5.05a1.5 1.5 0 0 0-.67-.55l-5.2-2.15c-.86-.36-.82-1.58.05-1.89Z"/>
      <path d="m21 4.2-8.93 9.92M12.27 14.43l3.34 5.05"/>
    </g>
    <path id="sendFill" d="M20.35 3.65c.85-.3 1.7.52 1.4 1.4l-4.3 14.15c-.26.85-1.35 1.02-1.84.28l-3.34-5.05a1.5 1.5 0 0 0-.67-.55l-5.2-2.15c-.86-.36-.82-1.58.05-1.89Z"/>
    <path id="sendTrace" d="m21 4.2-8.93 9.92M12.27 14.43l3.34 5.05"/>

    <style>
      .board-title { font: 700 30px Inter,"Microsoft YaHei",sans-serif; fill:#1E231F; letter-spacing:-.7px }
      .board-sub { font: 400 13px Inter,"Microsoft YaHei",sans-serif; fill:#747D76 }
      .kicker { font: 700 10px Inter,sans-serif; fill:#4E776D; letter-spacing:2px }
      .column-title { font: 700 12px Inter,"Microsoft YaHei",sans-serif; fill:#2B312C }
      .column-time { font: 500 10px ui-monospace,SFMono-Regular,Consolas,monospace; fill:#8B938D }
      .row-title { font: 700 16px Inter,"Microsoft YaHei",sans-serif; fill:#252A26 }
      .row-sub { font: 400 11px Inter,"Microsoft YaHei",sans-serif; fill:#7C857E }
      .note { font: 500 10px Inter,"Microsoft YaHei",sans-serif; fill:#737C75 }
      .cell { fill:#FCFDFB; stroke:#D9DEDA }
      .cell-hot { fill:#FCFDFB; stroke:#BCCBC5; filter:url(#softShadow) }
      .ink { color:#29312C }
      .paper { fill:#EDF0EC }
      .mint { fill:#8AD4C6 }
      .violet { fill:#A99CEC }
      .yellow { fill:#F1CD78 }
      .coral { fill:#EEA18E }
      .sky { fill:#91C7E5 }
      .white-trace { fill:none; stroke:#FFF; stroke-width:1.05; stroke-linecap:round; stroke-linejoin:round }
      .send-seam { fill:none; stroke:#F7D9D2; stroke-width:.58; stroke-linecap:round; stroke-linejoin:round }
      .guide { fill:none; stroke:#AEB5B0; stroke-width:1.2; stroke-dasharray:3 4; marker-end:url(#arrow) }
      .motion { fill:none; stroke:#8D9690; stroke-width:1.15; stroke-dasharray:2.5 3 }
    </style>
  </defs>

  <rect width="1500" height="1080" fill="#F0F2EE"/>
  <rect x="30" y="30" width="1440" height="1020" rx="28" fill="#F9FAF7" stroke="#D9DEDA"/>
  <text x="70" y="84" class="kicker">SLEEPY DOLL · LAYERED ICON MOTION · V2</text>
  <text x="70" y="126" class="board-title">统一图标动效过程</text>
  <text x="70" y="154" class="board-sub">四枚图标共享同一语法：黑色轮廓保持稳定，底纸先出现，颜色从底部折入，白色描线最后完成细节。</text>

  <g transform="translate(270 185)">
    <text x="16" y="0" class="column-title">01 静止轮廓</text><text x="16" y="18" class="column-time">idle · 0 ms</text>
    <text x="306" y="0" class="column-title">02 底纸 + 颜色折入</text><text x="306" y="18" class="column-time">reveal · 0–150 ms</text>
    <text x="596" y="0" class="column-title">03 白色描线 + 细节</text><text x="596" y="18" class="column-time">detail · 150–260 ms</text>
    <text x="886" y="0" class="column-title">04 按下 / 完成</text><text x="886" y="18" class="column-time">press · 260–360 ms</text>
  </g>

  <!-- Shared cell grid -->
  <g fill="none" stroke="#E1E5E1">
    <path d="M255 218H1430M255 422H1430M255 626H1430M255 830H1430M255 1034H1430"/>
  </g>

  <!-- ROW 1 moon pillow -->
  <text x="70" y="276" class="row-title">月相轨道</text><text x="70" y="296" class="row-sub">品牌 / 抽象状态</text>
  <text x="70" y="329" class="note">前后遮挡的倾斜轨道、卫星点</text><text x="70" y="345" class="note">与双层月面；不包含拟人元素。</text>
  <path d="M525 320H560M815 320H850M1105 320H1140" class="guide"/>
  <g transform="translate(270 238)"><rect width="255" height="164" rx="18" class="cell"/><g class="ink" transform="translate(79 34) scale(4)"><use href="#moonOutline"/></g></g>
  <g transform="translate(560 238)"><rect width="255" height="164" rx="18" class="cell"/><ellipse cx="128" cy="87" rx="55" ry="31" transform="rotate(-17 128 87)" fill="none" stroke="#DDE4E0" stroke-width="9"/><circle cx="128" cy="86" r="47" class="paper"/><g transform="translate(79 34) scale(4)"><use href="#moonFill" class="violet" opacity=".78"/><use href="#moonDepth" fill="#7668C8" opacity=".45"/><use href="#moonOutline" class="ink"/></g><path d="M84 129C103 141 148 143 170 127" class="motion"/></g>
  <g transform="translate(850 238)"><rect width="255" height="164" rx="18" class="cell"/><ellipse cx="128" cy="87" rx="55" ry="31" transform="rotate(-17 128 87)" fill="none" stroke="#8FD0C4" stroke-width="3" stroke-dasharray="94 42"/><circle cx="128" cy="86" r="47" fill="#EEEAF9"/><g transform="translate(79 34) scale(4)"><use href="#moonFill" class="violet"/><use href="#moonDepth" fill="#7568C9" opacity=".55"/><use href="#moonOutline" class="ink"/><use href="#moonTrace" class="white-trace"/><path d="M15.2 5.1v2.2M14.1 6.2h2.2" stroke="#F1CD78" stroke-width="1.15" stroke-linecap="round"/></g><circle cx="184" cy="70" r="5" fill="#EEA18E" stroke="#FFF" stroke-width="2"/></g>
  <g transform="translate(1140 238)"><rect width="255" height="164" rx="18" class="cell-hot"/><ellipse cx="128" cy="84" rx="53" ry="29" transform="rotate(-17 128 84)" fill="none" stroke="#8FD0C4" stroke-width="3" stroke-dasharray="88 38"/><g transform="translate(84 41) rotate(2 48 48) scale(3.8)"><use href="#moonFill" class="violet"/><use href="#moonDepth" fill="#7568C9" opacity=".55"/><use href="#moonOutline" class="ink"/><use href="#moonTrace" class="white-trace"/></g><circle cx="181" cy="68" r="5" fill="#EEA18E" stroke="#FFF" stroke-width="2"/><path d="M94 137c21 8 52 8 71 0" class="motion"/><text x="18" y="146" class="note">轨道分前后层；卫星点延迟弹入</text></g>

  <!-- ROW 2 scan -->
  <text x="70" y="480" class="row-title">状态扫描</text><text x="70" y="500" class="row-sub">读取 / 观测</text>
  <text x="70" y="533" class="note">四角固定，扫描线单独移动，</text><text x="70" y="549" class="note">结果点只在读取完成后出现。</text>
  <path d="M525 524H560M815 524H850M1105 524H1140" class="guide"/>
  <g transform="translate(270 442)"><rect width="255" height="164" rx="18" class="cell"/><g class="ink" transform="translate(79 34) scale(4)"><use href="#scanOutline"/></g></g>
  <g transform="translate(560 442)"><rect width="255" height="164" rx="18" class="cell"/><rect x="77" y="35" width="102" height="102" rx="28" class="paper"/><g transform="translate(79 34) scale(4)"><use href="#scanFill" class="sky" opacity=".72"/><use href="#scanOutline" class="ink"/></g><path d="M89 62h78" class="motion"/><path d="M89 62v53" stroke="#669CBF" stroke-width="2"/></g>
  <g transform="translate(850 442)"><rect width="255" height="164" rx="18" class="cell"/><rect x="77" y="35" width="102" height="102" rx="28" fill="#E5F2F7"/><g transform="translate(79 34) scale(4)"><use href="#scanFill" class="sky"/><use href="#scanBand" class="violet" opacity=".62"/><use href="#scanOutline" class="ink"/><use href="#scanTrace" class="white-trace"/><circle cx="12" cy="12" r="1.3" fill="#FFF" stroke="#7568C9" stroke-width=".7"/></g></g>
  <g transform="translate(1140 442)"><rect width="255" height="164" rx="18" class="cell-hot"/><g transform="translate(83 39) scale(3.85)"><use href="#scanFill" class="sky"/><use href="#scanBand" class="violet" opacity=".62"/><use href="#scanOutline" class="ink"/><use href="#scanTrace" class="white-trace"/><circle cx="12" cy="12" r="1.3" fill="#FFF" stroke="#7568C9" stroke-width=".7"/><circle cx="18.3" cy="18.3" r="1.7" fill="#4DAA78" stroke="#FFF" stroke-width=".7"/></g><text x="18" y="146" class="note">扫描带停在锁定点；完成点最后弹入</text></g>

  <!-- ROW 3 route -->
  <text x="70" y="684" class="row-title">路线</text><text x="70" y="704" class="row-sub">检索 / 导航</text>
  <text x="70" y="737" class="note">地图颜色逐片折入，</text><text x="70" y="753" class="note">路线由 dashoffset 完整绘制。</text>
  <path d="M525 728H560M815 728H850M1105 728H1140" class="guide"/>
  <g transform="translate(270 646)"><rect width="255" height="164" rx="18" class="cell"/><g class="ink" transform="translate(79 34) scale(4)"><use href="#routeOutline"/><use href="#routeNodes"/></g></g>
  <g transform="translate(560 646)"><rect width="255" height="164" rx="18" class="cell"/><path d="M69 56 114 37l54 20 40-18v93l-40 17-54-20-45 20Z" class="paper"/><g transform="translate(79 34) scale(4)"><use href="#routeFillA" class="mint"/><use href="#routeFillB" class="yellow" opacity=".9"/><use href="#routeFillC" class="violet" opacity=".72"/><use href="#routeOutline" class="ink"/><use href="#routeNodes" class="ink"/></g></g>
  <g transform="translate(850 646)"><rect width="255" height="164" rx="18" class="cell"/><path d="M69 56 114 37l54 20 40-18v93l-40 17-54-20-45 20Z" fill="#EEF0EC"/><g transform="translate(79 34) scale(4)"><use href="#routeFillA" class="mint"/><use href="#routeFillB" class="yellow"/><use href="#routeFillC" class="violet"/><use href="#routeOutline" class="ink"/><use href="#routeTrace" class="white-trace"/><use href="#routeFoldTrace" class="white-trace"/><use href="#routeNodes" class="ink"/><circle cx="5.8" cy="14.7" r=".48" fill="#62BCAA"/><circle cx="17.85" cy="7.9" r=".48" fill="#887BDD"/></g></g>
  <g transform="translate(1140 646)"><rect width="255" height="164" rx="18" class="cell-hot"/><g transform="translate(83 39) rotate(-1 48 48) scale(3.85)"><use href="#routeFillA" class="mint"/><use href="#routeFillB" class="yellow"/><use href="#routeFillC" class="violet"/><use href="#routeOutline" class="ink"/><use href="#routeTrace" class="white-trace"/><use href="#routeFoldTrace" class="white-trace"/><use href="#routeNodes" class="ink"/><circle cx="5.8" cy="14.7" r=".48" fill="#62BCAA"/><circle cx="17.85" cy="7.9" r=".48" fill="#887BDD"/></g><text x="18" y="146" class="note">细描边节点内嵌同色核心，不另做徽章</text></g>

  <!-- ROW 4 send -->
  <text x="70" y="888" class="row-title">发送</text><text x="70" y="908" class="row-sub">提交 / 执行</text>
  <text x="70" y="941" class="note">主体填色由底部揭示，</text><text x="70" y="957" class="note">折线与尾迹依次完成。</text>
  <path d="M525 932H560M815 932H850M1105 932H1140" class="guide"/>
  <g transform="translate(270 850)"><rect width="255" height="164" rx="18" class="cell"/><g class="ink" transform="translate(79 34) scale(4)"><use href="#sendOutline"/></g></g>
  <g transform="translate(560 850)"><rect width="255" height="164" rx="18" class="cell"/><circle cx="128" cy="86" r="50" class="paper"/><g transform="translate(79 34) scale(4)"><use href="#sendFill" class="coral" opacity=".82"/><use href="#sendOutline" class="ink"/></g></g>
  <g transform="translate(850 850)"><rect width="255" height="164" rx="18" class="cell"/><circle cx="128" cy="86" r="50" fill="#F8EAE6"/><g transform="translate(79 34) scale(4)"><use href="#sendFill" class="coral"/><path d="m7.1 10.2 13.1-4.9-7.45 8.25Z" class="violet" opacity=".45"/><use href="#sendOutline" class="ink"/><use href="#sendTrace" class="send-seam"/></g><path d="M55 111h28M64 128h23" class="motion"/></g>
  <g transform="translate(1140 850)"><rect width="255" height="164" rx="18" class="cell-hot"/><g transform="translate(91 26) rotate(-4 48 48) scale(3.85)"><use href="#sendFill" class="coral"/><path d="m7.1 10.2 13.1-4.9-7.45 8.25Z" class="violet" opacity=".45"/><use href="#sendOutline" class="ink"/><use href="#sendTrace" class="send-seam"/></g><path d="M60 127h43" stroke="#5AB6A7" stroke-width="2.5" stroke-linecap="round" opacity=".78"/><path d="M76 143h36" stroke="#8677DB" stroke-width="2.5" stroke-linecap="round" opacity=".65"/><text x="18" y="146" class="note">窄暖色内缝服从外轮廓；尾迹错峰消失</text></g>

  <text x="70" y="1021" class="note">统一 Token：paper 120ms → color 160ms → detail 120ms · hover scale 1.04 · press scale .92 · cubic-bezier(.2,.8,.2,1) · reduced-motion 仅保留颜色切换</text>
</svg>
