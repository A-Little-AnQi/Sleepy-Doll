name: check

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: dotnet run --project bgi-bridge/dev/ContractTests.csproj
      - run: cargo fmt --all -- --check
      # `mock` is a non-default feature, so the tests that exercise it must ask
      # for it explicitly; the helper crates below still build without desktop.
      - run: cargo test --no-default-features --features mock
      - run: cargo check
      - run: cargo check --no-default-features
