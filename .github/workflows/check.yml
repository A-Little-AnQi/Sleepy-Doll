name: check

on:
  # 分支推送与 PR 各自跑一次。tag 不在这里触发：发布流程会以 workflow_call
  # 调它一次并要求发布作业依赖它，否则同一个 tag 会跑两遍。
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: dotnet run --project bgi-bridge/dev/ContractTests.csproj
      - run: cargo fmt --all -- --check
      - run: cargo test --no-default-features
      - run: cargo check
      - run: cargo check --no-default-features
