name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: sleepy-doll-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml
  release:
    needs: check
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      TEMP: ${{ github.workspace }}\target\ci\tmp
      TMP: ${{ github.workspace }}\target\ci\tmp
      npm_config_cache: ${{ github.workspace }}\target\ci\npm-cache
      WRANGLER_LOG_PATH: ${{ github.workspace }}\target\ci\wrangler
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_ACCOUNT_ID: "31b280af27ff4bf0d338ecd49cf27902"
      R2_BUCKET: sleepy-doll-releases
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build cache
        shell: pwsh
        run: New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve version
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $frontend = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($cargo -ne $frontend) { throw "Cargo 和前端版本不一致" }
          $tag = "v$cargo"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) { throw "标签与源码版本不一致" }
          "VERSION=$cargo" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - run: npm ci
      - name: Build product
        shell: cmd
        run: build-desktop.cmd
      - name: Upload and verify R2 files
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node installer/publish-r2.mjs
      - name: Deploy distribution service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
        run: node installer/deploy-cloudflare.mjs
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @("dist/Sleepy-Doll-$env:VERSION-setup.exe", "dist/Sleepy-Doll-$env:VERSION-setup.exe.sha256", "dist/Sleepy-Doll-$env:VERSION-release.json")
          $notes = "web/src/app/release-notes/changelog-$env:VERSION.md"
          gh release view $env:RELEASE_TAG --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "上传 Release 文件失败" }
          } else {
            gh release create $env:RELEASE_TAG @assets --target "${{ github.sha }}" --draft --title "Sleepy Doll $env:VERSION" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }
          $prerelease = if ($env:VERSION -like '0.0.*') { "--prerelease=true" } else { "--prerelease=false" }
          gh release edit $env:RELEASE_TAG --draft=false $prerelease --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw "发布 Release 失败" }
      - name: Promote update channel
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node installer/publish-r2.mjs --promote
      - name: Verify published manifest
        shell: pwsh
        run: |
          $channel = if ($env:VERSION -like '0.0.*') { 'test' } else { 'stable' }
          $manifest = Invoke-RestMethod "https://sleepy-doll.restless-nh3.com/api/releases/$channel"
          if ($manifest.version -ne $env:VERSION) { throw "线上更新清单版本错误" }
          "已验证 $channel 通道：$($manifest.version)" >> $env:GITHUB_STEP_SUMMARY
