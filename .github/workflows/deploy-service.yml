name: deploy-service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cloudflare/**", "installer/deploy-cloudflare.mjs", ".github/workflows/deploy-service.yml"]
permissions:
  contents: read
concurrency:
  group: sleepy-doll-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TEMP: ${{ github.workspace }}/target/ci/tmp
      TMP: ${{ github.workspace }}/target/ci/tmp
      TMPDIR: ${{ github.workspace }}/target/ci/tmp
      npm_config_cache: ${{ github.workspace }}/target/ci/npm-cache
      WRANGLER_LOG_PATH: ${{ github.workspace }}/target/ci/wrangler
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_ACCOUNT_ID: "31b280af27ff4bf0d338ecd49cf27902"
      R2_BUCKET: sleepy-doll-releases
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cloudflare/worker.test.mjs installer/r2-budget.test.mjs installer/release-version.test.mjs
      - name: Audit R2 storage budget
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node installer/publish-r2.mjs --audit
      - name: Deploy API and analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
        run: node installer/deploy-cloudflare.mjs
